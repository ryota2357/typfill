name: Setup pnpm + Node + install
description: >
  Shared toolchain bootstrap for every CI/Deploy job: pnpm, the project's
  pinned Node version, and a frozen-lockfile install. Assumes the workflow
  has already run actions/checkout.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: latest
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.18.0
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
